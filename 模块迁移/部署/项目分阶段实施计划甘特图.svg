<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#39463f" flood-opacity="0.10"/>
    </filter>
    <pattern id="weekGrid" width="50" height="82" patternUnits="userSpaceOnUse">
      <path d="M50 0V82" stroke="#d7ddd8" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 34px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #29443a; }
      .subtitle { font: 400 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6c776f; }
      .head { font: 700 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fffdf8; }
      .month { font: 700 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fffdf8; }
      .week { font: 600 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #40574d; }
      .seq { font: 600 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #506159; }
      .stage { font: 700 17px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2c4138; }
      .period { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #54675e; }
      .work { font: 400 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #617068; }
      .bar-text { font: 700 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #fffdf8; }
      .note { font: 400 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #718078; }
      .legend { font: 500 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #54675e; }
    </style>
  </defs>

  <rect width="1840" height="980" fill="#f3efe6"/>
  <text x="920" y="50" text-anchor="middle" class="title">项目分阶段实施计划甘特图</text>
  <text x="920" y="78" text-anchor="middle" class="subtitle">建设期 16 周 · 上线后试运行 1 个月 · 试运行结束后组织正式验收</text>

  <!-- 表头 -->
  <rect x="35" y="100" width="1770" height="738" rx="14" fill="#fffdf8" stroke="#87998f" stroke-width="1.5" filter="url(#shadow)"/>
  <path d="M49 100H1791A14 14 0 0 1 1805 114V182H35V114A14 14 0 0 1 49 100Z" fill="#29443a"/>

  <rect x="35" y="100" width="80" height="82" fill="#29443a"/>
  <rect x="115" y="100" width="165" height="82" fill="#29443a"/>
  <rect x="280" y="100" width="150" height="82" fill="#29443a"/>
  <rect x="430" y="100" width="290" height="82" fill="#29443a"/>
  <text x="75" y="148" text-anchor="middle" class="head">序号</text>
  <text x="197" y="148" text-anchor="middle" class="head">实施阶段</text>
  <text x="355" y="148" text-anchor="middle" class="head">计划周期</text>
  <text x="575" y="148" text-anchor="middle" class="head">主要工作及里程碑</text>

  <rect x="720" y="100" width="200" height="42" fill="#3f6354"/>
  <rect x="920" y="100" width="200" height="42" fill="#4c705f"/>
  <rect x="1120" y="100" width="200" height="42" fill="#587b69"/>
  <rect x="1320" y="100" width="200" height="42" fill="#668876"/>
  <rect x="1520" y="100" width="200" height="42" fill="#7d6f58"/>
  <rect x="1720" y="100" width="85" height="42" fill="#5a493d"/>
  <text x="820" y="127" text-anchor="middle" class="month">第1月</text>
  <text x="1020" y="127" text-anchor="middle" class="month">第2月</text>
  <text x="1220" y="127" text-anchor="middle" class="month">第3月</text>
  <text x="1420" y="127" text-anchor="middle" class="month">第4月</text>
  <text x="1620" y="127" text-anchor="middle" class="month">上线后试运行</text>
  <text x="1762.5" y="127" text-anchor="middle" class="month">验收</text>

  <rect x="720" y="142" width="1085" height="40" fill="#e4ebe6"/>
  <g class="week" text-anchor="middle">
    <text x="745" y="168">1</text><text x="795" y="168">2</text><text x="845" y="168">3</text><text x="895" y="168">4</text>
    <text x="945" y="168">5</text><text x="995" y="168">6</text><text x="1045" y="168">7</text><text x="1095" y="168">8</text>
    <text x="1145" y="168">9</text><text x="1195" y="168">10</text><text x="1245" y="168">11</text><text x="1295" y="168">12</text>
    <text x="1345" y="168">13</text><text x="1395" y="168">14</text><text x="1445" y="168">15</text><text x="1495" y="168">16</text>
    <text x="1545" y="168">试1</text><text x="1595" y="168">试2</text><text x="1645" y="168">试3</text><text x="1695" y="168">试4</text>
    <text x="1762.5" y="168">验</text>
  </g>

  <!-- 行背景 -->
  <rect x="35" y="182" width="1770" height="82" fill="#fffdf8"/>
  <rect x="35" y="264" width="1770" height="82" fill="#f7f5ef"/>
  <rect x="35" y="346" width="1770" height="82" fill="#fffdf8"/>
  <rect x="35" y="428" width="1770" height="82" fill="#f7f5ef"/>
  <rect x="35" y="510" width="1770" height="82" fill="#fffdf8"/>
  <rect x="35" y="592" width="1770" height="82" fill="#f7f5ef"/>
  <rect x="35" y="674" width="1770" height="82" fill="#fffdf8"/>
  <rect x="35" y="756" width="1770" height="82" fill="#f7f5ef"/>
  <rect x="1520" y="182" width="200" height="656" fill="#eaf0ec" opacity="0.72"/>
  <rect x="1720" y="182" width="85" height="656" fill="#eee5d9" opacity="0.82"/>
  <rect x="720" y="182" width="1050" height="656" fill="url(#weekGrid)"/>

  <!-- 表格线 -->
  <g stroke="#d4d9d5" stroke-width="1">
    <line x1="115" y1="100" x2="115" y2="838"/><line x1="280" y1="100" x2="280" y2="838"/>
    <line x1="430" y1="100" x2="430" y2="838"/><line x1="720" y1="100" x2="720" y2="838"/>
    <line x1="35" y1="182" x2="1805" y2="182"/><line x1="35" y1="264" x2="1805" y2="264"/>
    <line x1="35" y1="346" x2="1805" y2="346"/><line x1="35" y1="428" x2="1805" y2="428"/>
    <line x1="35" y1="510" x2="1805" y2="510"/><line x1="35" y1="592" x2="1805" y2="592"/>
    <line x1="35" y1="674" x2="1805" y2="674"/><line x1="35" y1="756" x2="1805" y2="756"/>
  </g>

  <!-- 左侧任务信息 -->
  <g text-anchor="middle">
    <text x="75" y="229" class="seq">2.2.1</text><text x="197" y="229" class="stage">项目启动</text><text x="355" y="229" class="period">第1周</text>
    <text x="75" y="311" class="seq">2.2.2</text><text x="197" y="311" class="stage">需求确认</text><text x="355" y="311" class="period">第1至第3周</text>
    <text x="75" y="393" class="seq">2.2.3</text><text x="197" y="393" class="stage">方案设计</text><text x="355" y="393" class="period">第3至第5周</text>
    <text x="75" y="475" class="seq">2.2.4</text><text x="197" y="475" class="stage">系统开发</text><text x="355" y="475" class="period">第4至第12周</text>
    <text x="75" y="557" class="seq">2.2.5</text><text x="197" y="557" class="stage">联调测试</text><text x="355" y="557" class="period">第13至第14周</text>
    <text x="75" y="639" class="seq">2.2.6</text><text x="197" y="639" class="stage">部署培训</text><text x="355" y="639" class="period">第15至第16周</text>
    <text x="75" y="721" class="seq">2.2.7</text><text x="197" y="721" class="stage">系统试运行</text><text x="355" y="721" class="period">上线后1个月</text>
    <text x="75" y="803" class="seq">2.2.8</text><text x="197" y="803" class="stage">项目验收</text><text x="355" y="803" class="period">试运行结束后</text>
  </g>

  <g text-anchor="start" class="work">
    <text x="450" y="216"><tspan x="450">组建实施团队、明确职责分工</tspan><tspan x="450" dy="22">确认沟通机制与总体实施计划</tspan></text>
    <text x="450" y="298"><tspan x="450">开展业务调研、确认建设范围</tspan><tspan x="450" dy="22">形成业务流程及用户需求基线</tspan></text>
    <text x="450" y="380"><tspan x="450">完成总体、功能、数据、安全</tspan><tspan x="450" dy="22">及项目实施方案设计与确认</tspan></text>
    <text x="450" y="462"><tspan x="450">分阶段完成PC端后台管理</tspan><tspan x="450" dy="22">和微信小程序端功能建设</tspan></text>
    <text x="450" y="544"><tspan x="450">开展功能、流程、数据、权限</tspan><tspan x="450" dy="22">性能及安全测试并完成整改</tspan></text>
    <text x="450" y="626"><tspan x="450">完成系统部署、用户培训</tspan><tspan x="450" dy="22">上线检查并正式投入运行</tspan></text>
    <text x="450" y="708"><tspan x="450">持续跟踪运行情况、处理反馈问题</tspan><tspan x="450" dy="22">完善常见问题QA清单</tspan></text>
    <text x="450" y="790"><tspan x="450">提交项目验收资料</tspan><tspan x="450" dy="22">配合完成正式验收和项目交付</tspan></text>
  </g>

  <!-- 甘特条 -->
  <g filter="url(#shadow)">
    <rect x="725" y="209" width="40" height="28" rx="7" fill="#557a68"/>
    <rect x="725" y="291" width="140" height="28" rx="7" fill="#6f8a79"/>
    <rect x="825" y="373" width="140" height="28" rx="7" fill="#a2875e"/>
    <rect x="875" y="455" width="440" height="28" rx="7" fill="#4f7f6a"/>
    <rect x="1325" y="537" width="90" height="28" rx="7" fill="#8f755f"/>
    <rect x="1425" y="619" width="90" height="28" rx="7" fill="#725b48"/>
    <rect x="1525" y="701" width="190" height="28" rx="7" fill="#5d7467"/>
  </g>

  <g class="bar-text" text-anchor="middle">
    <text x="795" y="311">需求基线</text>
    <text x="895" y="393">方案确认</text>
    <text x="1095" y="475">功能建设</text>
    <text x="1370" y="557">测试通过</text>
    <text x="1470" y="639">正式上线</text>
    <text x="1620" y="721">运行跟踪与优化</text>
  </g>

  <!-- 里程碑 -->
  <g fill="#fffdf8" stroke="#29443a" stroke-width="2">
    <path d="M745 211l12 12-12 12-12-12Z"/>
    <path d="M845 293l12 12-12 12-12-12Z"/>
    <path d="M945 375l12 12-12 12-12-12Z"/>
    <path d="M1295 457l12 12-12 12-12-12Z"/>
    <path d="M1395 539l12 12-12 12-12-12Z"/>
    <path d="M1495 621l12 12-12 12-12-12Z"/>
    <path d="M1695 703l12 12-12 12-12-12Z"/>
    <path d="M1762.5 777l14 14-14 14-14-14Z" fill="#29443a"/>
  </g>
  <text x="1762.5" y="822" text-anchor="middle" class="week">项目交付</text>

  <!-- 图例与说明 -->
  <g transform="translate(55 880)">
    <rect x="0" y="0" width="72" height="22" rx="6" fill="#557a68"/>
    <text x="84" y="16" class="legend">实施任务</text>
    <path d="M205 0l11 11-11 11-11-11Z" fill="#fffdf8" stroke="#29443a" stroke-width="2"/>
    <text x="230" y="16" class="legend">阶段里程碑</text>
  </g>
  <text x="1785" y="896" text-anchor="end" class="note">计划周期采用相对周次，具体日期以项目启动令及经确认的总体实施计划为准</text>
  <text x="40" y="950" class="note">园区运营管理平台 · 项目实施计划</text>
  <text x="1800" y="950" text-anchor="end" class="note">启动 → 需求 → 设计 → 开发 → 测试 → 上线 → 试运行 → 验收</text>
</svg>
